name: check-reminders

# Poll Olympus every 5 minutes for due reminders. GitHub-hosted runners are
# free for public repos and run on a best-effort schedule (typical drift
# 1-3 minutes during high load periods). For exact-time delivery use a
# dedicated scheduler like Upstash QStash.
#
# Requires two repository secrets:
#   OLYMPUS_URL       e.g. https://olympus-dashboard-nine.vercel.app
#   OLYMPUS_CRON_SECRET  same as the CRON_SECRET in your Vercel env

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch: {}    # manual trigger from the Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Hit /api/cron/check-reminders
        env:
          OLYMPUS_URL: ${{ secrets.OLYMPUS_URL }}
          OLYMPUS_CRON_SECRET: ${{ secrets.OLYMPUS_CRON_SECRET }}
        run: |
          if [ -z "$OLYMPUS_URL" ] || [ -z "$OLYMPUS_CRON_SECRET" ]; then
            echo "Missing OLYMPUS_URL or OLYMPUS_CRON_SECRET secret. Skipping."
            exit 0
          fi
          curl -sS -m 30 \
            -H "Authorization: Bearer $OLYMPUS_CRON_SECRET" \
            "$OLYMPUS_URL/api/cron/check-reminders" \
            | tee /tmp/response.json
          echo
          # Surface failures as job failures so we see them in GitHub.
          if grep -q '"error"' /tmp/response.json; then
            echo "::error::Reminder poll returned an error"
            exit 1
          fi
